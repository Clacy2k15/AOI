inherits: configs/aoi.yaml
project:
  category: screw
  splits: splits/screw.json
  output_root: outputs/products/screw
  model_root: models/products/screw
  inference_config: configs/products/screw/inference.yaml
  cpu_threads: 6
efficientad:
  max_epochs: 1000
  num_workers: 4
  imagenette_workers: 4
preprocessing:
  geometry:
    crop_guard: unverified
patchcore:
  batch_size: 128
  num_workers: 6
loader:
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
