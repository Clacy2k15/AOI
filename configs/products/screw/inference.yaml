    threads extending to a pointed tip.


    Choose one class:

    1 = manipulated_front: Deformation at the thread tip, often flattened instead
    of pointed.

    2 = scratch_head: A scratch or damaged surface on the screw head.

    3 = scratch_neck: A scratch or deformity on the smooth neck/shank.

    4 = thread_side: Damaged or irregular serrated thread edges directed to the side.

    5 = thread_top: Damaged or irregular threading visible on the upper-facing thread
    surface; distinguish by position/view from thread_side.

    6 = unknown_defect: No clear defect, insufficient evidence, unsupported defect,
    or ambiguous class.


    Return exactly one complete class ID from 1, 2, 3, 4, 5, 6, with no other text.'
