    4 = liquid: Accumulated liquid/resin-like material disrupts the wood grain.

    5 = scratch: Abraded scratches, scuffs or gouges on the wood.

    6 = unknown_defect: No clear defect, insufficient evidence, unsupported defect,
    or ambiguous class.


