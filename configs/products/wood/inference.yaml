    2 = combined: Must contain visible defects from at least TWO DIFFERENT defect
    categories among color, hole, liquid, and scratch. Choose combined ONLY when at
    least two of these categories are each clearly identifiable in the same image,
    such as hole plus scratch or hole plus liquid. Multiple defects, marks, or locations
