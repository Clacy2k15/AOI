    metal wires.


    Choose one class:

    1 = bent: Locally bent wires distort the regular cell geometry.

    2 = broken: Fractured wires leave a visible gap or disconnected segment.

    3 = glue: Glossy or semitransparent residue obscures the grid; an obstruction
