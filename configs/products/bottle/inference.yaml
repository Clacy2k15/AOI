classification:
  labels:
    '1': broken_large
    '2': broken_small
    '3': contamination
    '4': unknown_defect
  normal: 'An intact glass mouth viewed from above has a clean inner bore and a continuous
    smooth finish ring around it. Compare with the normal reference: if there is no
    visible break or foreign matter, choose unknown_defect. For an actual anomaly,
    first distinguish inner-bore contamination from a broken glass finish; then estimate
    the damaged fraction of the finish circumference.'
  defects:
    broken_large: A substantial fracture or missing/broken section of the glass finish
      ring outside the inner bore, affecting at least one fifth (20 percent) of the
      full finish circumference. Judge the whole damaged arc.
    broken_small: A real localized chip or break in the glass finish ring outside
      the inner bore, affecting less than one fifth (20 percent) of its circumference.
      An intact smooth finish without a chip is unknown_defect.
    contamination: Foreign particles, debris or contamination in the inner bore, possibly
      extending beyond it; distinguish foreign matter from fractured glass in the
      surrounding finish.
  source_snapshots: outputs/expansion/source_snapshot_manifest.json
  prompt_validation_status: user_selected_official_prompt_fixed_four_dev
  prompt: 'Image 1: normal reference. Image 2: query, possibly normal.


    Image 3 is only a weak search hint and may outline intact glass.


    Inspect Image 2 first. Use Image 3 to find subtle marks, then verify


    in Image 2. Actual appearance in Image 2 overrides the red outline.


    Ordinary glass texture and reflections are not defects.


    The inner bore is the central opening and inner wall; the finish is


    the surrounding glass rim and transition area. Check physical damage


    before judging its size:


    - A jagged chip or missing glass in the finish is breakage, even when


      bright or near the inner edge. Do not call fractured glass debris.


    - Foreign material, deposits, or faint translucent residue inside the


      bore, without corresponding glass breakage, indicate contamination;


      material may extend outside the bore.


    For breakage, count only the arc of visibly missing or fractured


    glass in Image 2. Exclude intact glass inside the red outline.


    Compare that arc with the full finish circumference, ignoring


    outline size and brightness. A bright localized chip can still


    be broken_small.


    Brightness is NOT a classification criterion. Never infer defect


    class or severity from brightness, glare, highlights, or contrast.


    A very bright chip is not necessarily large; a dark fracture is not


    necessarily small. Judge only physical damage, shape, and extent.


    1 = broken_large: finish breakage affecting at least 20% of circumference, typically
    an elongated curved strip extending along the rim with pronounced arc-shaped curvature.
    It usually has only one red contour. Do not combine distant red contours into
    one large break.


    2 = broken_small: localized finish breakage affecting less than 20%, with the
    main damaged region typically compact, block-like, a triangular wedge, or a short
    slightly curved patch.


    3 = contamination: foreign matter or residue in the bore or inner wall.


    4 = unknown_defect: no clear defect, insufficient evidence, or ambiguity.


    Return only one class ID: 1, 2, 3, or 4.'
