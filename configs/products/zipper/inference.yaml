    Predicted locations may be wrong or missing; inspect the full original query and
    normal reference.

    Normal appearance: Uniform fabric tape with intact borders and evenly interlocking
    coil/teeth.


    Choose one class:

    1 = broken_teeth: Altered or damaged coil/teeth, including the sources'' unusual
    shiny surface cue or fabric lying over the teeth; inspect the teeth themselves.

    2 = combined: Multiple visible defects together, such as frayed fabric borders
    and split or compressed teeth; retain one dataset class.

    3 = fabric_border: Fraying or unraveling confined to the outermost fabric tape
    edge.

    4 = fabric_interior: Fiber balls or pilling on fabric between the outer border
    and coil, away from the edge.

    5 = rough: Rough, jagged surface or edges directly on the coil/teeth.

    6 = split_teeth: A locally separated/unzipped section creates a gap between the
    teeth.

    7 = squeezed_teeth: Compressed or pinched coil/teeth deform and may overlap horizontally.

