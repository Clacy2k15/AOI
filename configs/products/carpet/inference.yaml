  class_prompt: 'The detector may produce false alarms. Ignore the red annotation
    when judging physical appearance.

    Predicted locations may be wrong or missing; inspect the full original query and
    normal reference.

    Normal appearance: Uniform tightly woven carpet with intact fibers and consistent
    color.


    Choose one class:

    1 = color: Abnormal dark, blue or red stain absorbed in the fibers.

    2 = cut: A narrow linear gash or slit where the thick woven carpet yarns themselves
    are severed, frayed, and parted, creating a recessed break in the grid.

    3 = hole: A wider, localized open gap or missing patch (non-linear) where multiple
    interlocking yarns are completely gone, exposing the backing.

    4 = metal_contamination: A foreign metallic piece embedded in or lying across
    the weave.

    5 = thread: An extra loose thread or thin continuous filament (straight or curved,
    dark or light) lying on top of the surface across an intact woven grid without
    severing the underlying yarns.

    6 = unknown_defect: No clear defect, insufficient evidence, unsupported defect,
    or ambiguous class.


    Return exactly one complete class ID from 1, 2, 3, 4, 5, 6, with no other text.'
  product: carpet
  labels:
