classification:
  labels:
    '1': crack
    '2': cut
    '3': hole
    '4': print
    '5': unknown_defect
  normal: 'An intact brown shell has natural fine grooves, shading and a rough pale
    basal cap. Natural grooves do not expose an open cavity. First inspect whether
    shell material is split or missing: a pale fracture face is not white paint. A
    continuous shell with no supported defect is unknown_defect.'
  defects:
    crack: An irregular split or broken opening in the shell, with separated jagged
      edges, missing fragments or a visible dark interior. The broken shell cross-section
      may be pale cream or white; this structural opening takes precedence over the
      apparent light color.
    cut: A comparatively straight narrow scored or scratched groove across the shell
      surface, often darker, without the broad jagged open cavity of a broken shell.
    hole: A small compact round or oval borehole with a localized perimeter; distinguish
      it from an elongated ragged split with shell fragments.
    print: A whitish printed mark, deposited substance or stain lying on a continuous
      shell surface. The shell remains closed beneath the white mark; exposed pale
      shell edges around a dark opening are crack, not print.
