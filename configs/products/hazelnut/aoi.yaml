inherits: configs/aoi.yaml
project:
  category: hazelnut
  splits: splits/hazelnut.json
  output_root: outputs/products/hazelnut
  model_root: models/products/hazelnut
  inference_config: configs/products/hazelnut/inference.yaml
  cpu_threads: 6
efficientad:
  max_epochs: 1000
  num_workers: 4
  imagenette_workers: 4
preprocessing:
  geometry:
    crop_guard: unverified
classification:
  labels:
    '1': crack
    '2': cut
    '3': hole
    '4': print
    '5': unknown_defect
  normal: Intact light-brown shell with natural small ridges and grooves.
  defects:
    crack: A visible fissure or break in the shell.
    cut: A long linear cut or dark scratch mark on the shell surface.
    hole: A small round borehole in the shell.
    print: A whitish substance, printed mark or stain on the shell.
  source_snapshots: outputs/expansion/source_snapshot_manifest.json
  prompt_validation_status: not_evaluated_E0
patchcore:
  batch_size: 128
  num_workers: 6
loader:
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
